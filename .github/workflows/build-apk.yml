name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL baked into the app (e.g. https://vpl.example.com/api)'
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'https://mevadacreation.site/api' }}
    steps:
      # Never publish an APK signed with a throwaway key: players could not update over it.
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add repo secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ + pubspec; generate the android/ platform folder here.
      - name: Generate platform folders
        run: |
          flutter create . --project-name vpl_player --org com.webcreta --platforms=android
          dart run tool/setup_platforms.dart
          cp -R tool/android_res/. android/app/src/main/res/
          # drop any adaptive icon so the VPL launcher PNGs are used
          rm -rf android/app/src/main/res/mipmap-anydpi*

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=$API_BASE_URL 2>&1 | tee build.log
      - name: Show build error
        if: failure()
        run: |
          grep -n -i -E "error|wrong|failed|exception|caused by|not found|incompatible" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done

      # Re-sign with the permanent key so each new APK installs over the previous one.
      - name: Sign the APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/vpl.p12"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/vpl.p12" --ks-type PKCS12 --ks-key-alias vpl \
            --ks-pass env:PW --key-pass env:PW --out vpl-player.apk build/app/outputs/flutter-apk/app-release.apk
          rm -f "$RUNNER_TEMP/vpl.p12"
          "$TOOLS/apksigner" verify --print-certs vpl-player.apk | grep SHA-256
          # Fail if the APK is not signed with the expected certificate.
          "$TOOLS/apksigner" verify --print-certs vpl-player.apk | grep -qi 3f67fa8d230660316293e905a76997da2ee90882da3972d36aa2cb3fab141b67

      # Download from the run page -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: vpl-player-apk
          path: vpl-player.apk

      # Stable download link: Releases -> "Latest build" (updated on every push to main)
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          files: vpl-player.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
