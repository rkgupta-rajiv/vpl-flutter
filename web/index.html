<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="Vankar Premier League player registration">
  <meta name="theme-color" content="#13704A">

  <!-- iOS "Add to Home Screen" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VPL">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>VPL Player</title>

  <style>
    body{margin:0;background:#062419;font-family:system-ui,-apple-system,sans-serif}
    #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
    #splash img{width:140px;height:140px}
    #install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;z-index:2147483647;
      display:none;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
    #install img{width:44px;height:44px;flex:none}
    #install .txt{flex:1;font-size:13px;line-height:1.4;color:#1e293b}
    #install b{display:block;font-size:14px}
    #install button{border:0;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    #install-btn{background:#13704a;color:#fff;padding:10px 14px;display:none}
    #install-close{background:transparent;color:#64748b;font-size:20px!important;padding:4px 8px}
  </style>
  <script>
    // Must listen before the app loads, or Chrome's install event is missed.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.vplPrompt = e;
      window.dispatchEvent(new Event('vpl-installable'));
    });
  </script>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="VPL"></div>

  <div id="install">
    <img src="icons/Icon-192.png" alt="">
    <div class="txt"><b>Install VPL app</b><span id="install-help"></span></div>
    <button id="install-btn" type="button">Install</button>
    <button id="install-close" type="button" aria-label="Close">&times;</button>
  </div>

  <script>
  (function () {
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
    var installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (installed) return;

    var box = document.getElementById('install'), btn = document.getElementById('install-btn'),
        help = document.getElementById('install-help');
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var closed = false;
    function show(text, withButton) {
      if (closed) return;
      help.textContent = text; btn.style.display = withButton ? 'block' : 'none'; box.style.display = 'flex';
    }
    function ready() { show('Add it to your home screen for one-tap access.', true); }

    document.getElementById('install-close').onclick = function () { closed = true; box.style.display = 'none'; };
    btn.onclick = function () {
      var p = window.vplPrompt; if (!p) return;
      p.prompt();
      p.userChoice.then(function () { window.vplPrompt = null; box.style.display = 'none'; });
    };
    window.addEventListener('appinstalled', function () { box.style.display = 'none'; });

    if (ios) {
      show('Tap the Share button, then "Add to Home Screen". If you do not see it, open this link in Safari.', false);
    } else {
      window.addEventListener('vpl-installable', ready);
      if (window.vplPrompt) ready();
      // Browsers without an install prompt still offer it in their menu.
      setTimeout(function () {
        if (!window.vplPrompt && box.style.display === 'none') {
          show('Open the browser menu and choose "Install app" or "Add to Home screen".', false);
        }
      }, 4000);
    }
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
